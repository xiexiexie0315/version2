amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 300
    max_particles: 800
    laser_model_type: likelihood_field
    laser_max_range: 10.0
    laser_min_range: 0.4
    max_beams: 120
    update_min_d: 0.02
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false
    initial_pose:
      x: -4.0
      y: 3.5
      z: 0.0
      yaw: 0.0
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    sigma_hit: 0.1
    z_hit: 0.95
    z_rand: 0.05
    z_short: 0.0
    z_max: 0.0
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: pb_omni_pid_pursuit_controller::OmniPidPursuitController
      translation_kp: 1.0
      translation_ki: 0.0
      translation_kd: 0.0
      enable_rotation: false
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.3
      min_max_sum_error: 1.0
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.0
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.4
      use_interpolation: false
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.5
      v_linear_min: 0.0
      v_linear_max: 0.2
      v_angular_min: -3.0
      v_angular_max: 3.0
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9
    progress_checker_plugin: progress_checker
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 2.0
      resolution: 0.05
      robot_radius: 0.374
      transform_tolerance: 0.5
      rolling_window: true
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_min_range: 0.4
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 8.0
      width: 3
      height: 3
      footprint_padding: 0.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      robot_radius: 0.374
      transform_tolerance: 0.5
      rolling_window: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_min_range: 0.4
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 8.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      footprint_padding: 0.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: false
      allow_unknown: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
